Z4M+ectt/hpafTxhrt8/dAKHpAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOAdAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/9k=",ie=[{id:"c1",axis:"commercial",name:"Compatibilidade do público consumidor",weight:25,explanation:"Observe os hábitos de compra e a procura por produtos semelhantes.",descriptions:["Público com hábitos de compra muito diferentes, sem sinais de interesse em produtos semelhantes.","Pouca relação entre os hábitos predominantes e o consumo dos produtos da Cajumel.","Parte do público demonstra interesse ou consome alimentos semelhantes.","Público com hábitos compatíveis, que costuma adquirir castanhas, snacks, produtos artesanais ou similares.","Evidências consistentes de procura ou compra frequente de produtos semelhantes."]},{id:"c2",axis:"commercial",name:"Contexto de compra e adequação do mix",weight:25,explanation:"Identifique as ocasiões de consumo e os produtos que complementam o mix.",descriptions:["Produtos sem relação clara com o motivo da visita ao estabelecimento.","Compra ocasional, dependente de estímulos específicos, com poucas opções de mix compatíveis.","Existe pelo menos uma oportunidade identificável de compra, como lanche, presente ou impulso.","Existem oportunidades frequentes de compra e um conjunto relevante de produtos adequados.","Os produtos complementam diretamente a experiência de compra, com várias oportunidades naturais de consumo."]},{id:"c3",axis:"commercial",name:"Fluxo e recorrência de clientes",weight:20,explanation:"Avalie o movimento de clientes e a frequência com que retornam.",descriptions:["Fluxo muito reduzido ou eventual.","Fluxo baixo ou concentrado em ocasiões específicas, com pouca recorrência.","Fluxo regular em determinados dias ou horários, com alguma recorrência.","Bom fluxo durante a semana, com consumidores recorrentes.","Fluxo elevado e consistente em diferentes períodos, com forte recorrência."]},{id:"c4",axis:"commercial",name:"Viabilidade de abastecimento",weight:15,explanation:"Em Natal, a Cajumel realiza as entregas. Fora de Natal, o parceiro retira os produtos na fábrica.",descriptions:["Abastecimento tecnicamente possível, mas com grandes dificuldades operacionais.","Abastecimento viável, porém com restrições relevantes de frequência, horário ou deslocamento.","Abastecimento possível mediante programação e ajustes.","Abastecimento simples, regular e com baixo risco de atrasos.","Abastecimento altamente previsível e de baixo esforço operacional."]},{id:"c5",axis:"commercial",name:"Condições comerciais da parceria",weight:15,explanation:"Avalie preços, prazos, prestação de contas, comunicação e organização.",descriptions:["Diversas restrições comerciais e pouca estrutura de controle.","Aceita negociar, mas exige vários ajustes e possui limitações relevantes.","Aceita as principais condições, mas precisa de acompanhamento próximo.","Demonstra organização e disposição para cumprir preços, prazos e prestação de contas.","Organização comprovada, boa comunicação e plena aderência às condições propostas."]},{id:"c6",axis:"brand",name:"Posicionamento do estabelecimento",weight:30,explanation:"Não confundir sofisticação ou preço elevado com aderência à marca.",descriptions:["Imagem e experiência de compra fortemente incompatíveis com a Cajumel.","Limitações visíveis de organização, apresentação ou percepção de qualidade.","Imagem aceitável e ambiente organizado, mas sem identificação clara com a marca.","Apresentação de qualidade e experiência coerente com o posicionamento regional, artesanal e acessível.","Forte compatibilidade de posicionamento, experiência e percepção de qualidade."]},{id:"c7",axis:"brand",name:"Compatibilidade do público com a imagem da marca",weight:25,explanation:"Observe a afinidade do público com a origem, a qualidade e a identidade da Cajumel.",descriptions:["Nenhuma ide
